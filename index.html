<body>
<h1>QR dinámicos</h1>
<p>Para cambiar el destino de un QR, edita <code>links.json</code> y ejecuta <code>npm run build</code>. El código QR no cambia.</p>
<section>
<h2>Falabella Chile</h2>
<img src="qr/falabella-cl.svg" alt="QR Falabella Chile" width="256" height="256">
<p>QR apunta a: <code>https://matias-240.github.io/qr-dinamicos/r/falabella-cl/</code></p>
<p>Destino actual: <a href="https://www.falabella.com/falabella-cl">https://www.falabella.com/falabella-cl</a></p>
<p><a href="qr/falabella-cl.png">Descargar PNG</a> · <a href="qr/falabella-cl.svg">Descargar SVG</a></p>
